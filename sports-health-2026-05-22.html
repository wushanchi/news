<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运动健康日报 · 2026-05-22</title>
<style>
:root {
  --c-bg:#0f0e06;--c-surface:#1c180a;--c-card:#261e0f;--c-border:#3a2e18;
  --c-text:#faf0d4;--c-text-dim:#9e8a52;--c-accent:#f59e0b;--c-accent2:#fbbf24;
  --c-accent-glow:rgba(245,158,11,0.15);--c-tag-sports:#f59e0b;--c-tag-fitness:#d97706;
  --c-tag-nutrition:#b45309;--c-tag-wellness:#eab308;
  --c-grad-start:#78350f;--c-grad-mid:#92400e;--c-grad-end:#451a03;
  --radius:14px;--radius-sm:8px;--transition:0.28s cubic-bezier(0.4,0,0.2,1);
  --font-mono:'SF Mono','Cascadia Code','Consolas',monospace;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);background:var(--c-bg);color:var(--c-text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.hero{position:relative;background:linear-gradient(135deg,var(--c-grad-start),var(--c-grad-mid) 50%,var(--c-grad-end));padding:60px 24px 56px;text-align:center;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,0.06),transparent 60%),radial-gradient(circle at 70% 80%,rgba(245,158,11,0.1),transparent 50%)}
.hero-date{position:relative;font-size:15px;font-weight:500;color:rgba(255,255,255,0.7);letter-spacing:.06em;margin-bottom:8px}
.hero h1{position:relative;font-size:clamp(32px,6vw,52px);font-weight:800;letter-spacing:-.02em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.hero-total{position:relative;display:inline-block;margin-top:12px;font-size:13px;font-weight:500;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);padding:6px 18px;border-radius:20px;color:rgba(255,255,255,.9)}
.stats-wrap{position:relative;margin-top:-28px;padding:0 16px;z-index:2}
.stats{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:18px 20px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.stat{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--c-text-dim)}.stat strong{color:var(--c-text);font-weight:600}
.stat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.nav-wrap{position:sticky;top:0;z-index:10;background:rgba(15,14,6,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--c-border);padding:0 16px}
.nav{max-width:900px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:5px;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--c-text-dim);transition:var(--transition)}
.nav a:hover{color:var(--c-text);background:var(--c-card)}
.nav a .nav-count{font-size:11px;background:var(--c-border);padding:1px 7px;border-radius:10px;color:var(--c-text-dim)}
.main{max-width:900px;margin:0 auto;padding:32px 16px 60px}
.section{margin-bottom:40px}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid var(--c-border)}
.section-badge{font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 12px;border-radius:4px;text-transform:uppercase;color:#fff}
.section-header h2{font-size:20px;font-weight:700;color:var(--c-text)}
.section-count{font-size:13px;color:var(--c-text-dim);margin-left:auto}
.badge-sports{background:var(--c-tag-sports)}.badge-fitness{background:var(--c-tag-fitness)}
.badge-nutrition{background:var(--c-tag-nutrition)}.badge-wellness{background:var(--c-tag-wellness)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform var(--transition),box-shadow var(--transition);position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.35);border-color:var(--c-accent)}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--c-accent),var(--c-accent2));opacity:0;transition:opacity var(--transition)}
.card:hover::after{opacity:1}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-num{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--c-accent);background:var(--c-accent-glow);padding:2px 10px;border-radius:var(--radius-sm);flex-shrink:0}
.card-source{font-size:11px;font-weight:500;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.06);color:var(--c-text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.card-title{font-size:15px;font-weight:700;line-height:1.45;color:var(--c-text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-summary{font-size:13px;line-height:1.55;color:var(--c-text-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-actions{display:flex;align-items:center;gap:8px;margin-top:auto}
.card-time{font-size:11px;color:var(--c-text-dim);opacity:.7}
.card-link{margin-left:auto;font-size:12px;font-weight:600;color:var(--c-accent2);padding:5px 14px;border:1px solid rgba(251,191,36,.3);border-radius:var(--radius-sm);transition:var(--transition);display:inline-flex;align-items:center;gap:4px}
.card-link:hover{background:var(--c-accent);color:#fff;border-color:var(--c-accent)}
.card-link svg{width:14px;height:14px;flex-shrink:0}
.card-animate{opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease}
.card-animate.visible{opacity:1;transform:translateY(0)}
.footer{text-align:center;padding:24px 16px 40px;font-size:12px;color:var(--c-text-dim);opacity:.6;border-top:1px solid var(--c-border)}
.footer a{color:var(--c-accent2)}
@media(max-width:600px){.hero{padding:44px 16px 40px}.cards{grid-template-columns:1fr}.stats{gap:6px;padding:14px}.stat{font-size:12px}.nav a{padding:6px 12px;font-size:12px}}
</style>
</head>

  </div>
</div>
<nav class="nav-wrap"><div class="nav">
